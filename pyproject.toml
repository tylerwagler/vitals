[project]
name = "vitals"
dynamic = ["version"]
description = "One host's hardware, OS and live state as JSON over HTTP, with a Server-Sent Events stream"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "nvidia-ml-py>=12.535",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vitals = "vitals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "vitals.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
