[project]
name = "sparkview-exporter"
version = "0.1.0"
description = "One host's GPU and hardware state as JSON, for pulsar-gui's cluster view"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "nvidia-ml-py>=12.535",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sparkview-exporter = "sparkview_exporter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sparkview_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
